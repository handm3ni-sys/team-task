services:
  # Backend Python REST API
  backend:
    build: ./backend                  # build image dari backend/Dockerfile
    container_name: task-backend
    volumes:
      - team-task-data:/var/lib/backend_data   # Named Volume: data tetap aman
    networks:
      - app-net
    restart: unless-stopped

  # Frontend Nginx
  frontend:
    image: nginx:alpine
    container_name: task-frontend
    ports:
      - "8080:80"                     # buka di browser: localhost:8080
    volumes:
      - ./frontend:/usr/share/nginx/html                      # Bind Mount UI
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf  # config proxy /api
    depends_on:
      - backend
    networks:
      - app-net
    restart: unless-stopped

# Custom Bridge Network
networks:
  app-net:
    driver: bridge

# Named Volume untuk tasks.json
volumes:
  team-task-data: