<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team Task &amp; Note List</title>

  <style>
    /* ===== Warna & ukuran dasar (diatur di satu tempat biar gampang diubah) ===== */
    :root {
      --bg: #0e0f13;                         /* latar gelap, tidak hitam pekat */
      --glass: rgba(255, 255, 255, 0.05);    /* kartu transparan (efek kaca) */
      --glass-border: rgba(255, 255, 255, 0.09);
      --text: #ecebe6;                       /* putih hangat, tidak silau */
      --muted: #9a978f;                      /* teks sekunder */
      --accent: #e8b86d;                     /* aksen emas lembut */
      --accent-text: #1c1608;
      --danger: #e5776b;
      --radius: 18px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      color: var(--text);
      background: var(--bg);
      /* Dua cahaya samar di belakang supaya efek blur kaca kelihatan */
      background-image:
        radial-gradient(600px 400px at 15% 10%, rgba(232, 184, 109, 0.10), transparent 70%),
        radial-gradient(700px 500px at 90% 80%, rgba(93, 202, 165, 0.08), transparent 70%);
      background-attachment: fixed;
      padding: 0 20px 60px;
    }

    .container { max-width: 760px; margin: 0 auto; }

    /* ===== Dynamic Island: pil hitam di atas yang menampilkan jumlah tugas ===== */
    .island-wrap {
      position: sticky;
      top: 14px;
      display: flex;
      justify-content: center;
      z-index: 10;
      padding-top: 14px;
    }
    .island {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 150px;
      padding: 10px 20px;
      border-radius: 999px;
      background: rgba(0, 0, 0, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      font-size: 14px;
      justify-content: center;
      transition: min-width 0.35s ease, padding 0.35s ease;
    }
    /* Saat ada notifikasi, pil melebar seperti Dynamic Island */
    .island.expand { min-width: 280px; padding: 12px 26px; }
    .island .dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: #5dcaa5;                  /* hijau = normal */
      flex-shrink: 0;
    }
    .island.error .dot { background: var(--danger); }   /* merah = error */
    .island.success .dot { background: var(--accent); } /* emas = berhasil */

    /* ===== Judul ===== */
    h1 {
      text-align: center;
      font-size: clamp(28px, 5vw, 40px);
      font-weight: 600;
      letter-spacing: -0.5px;
      margin: 40px 0 32px;
    }

    /* ===== Kartu kaca (dipakai form & tiap tugas) ===== */
    .glass {
      background: var(--glass);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
    }

    /* ===== Form tambah tugas ===== */
    form { padding: 22px; display: grid; gap: 14px; margin-bottom: 36px; }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
    input, textarea {
      width: 100%;
      padding: 12px 14px;
      border-radius: 12px;
      border: 1px solid var(--glass-border);
      background: rgba(0, 0, 0, 0.25);
      color: var(--text);
      font: inherit;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--accent); }
    textarea { resize: vertical; min-height: 70px; }

    .btn-add {
      justify-self: end;
      padding: 12px 26px;
      border: none;
      border-radius: 999px;
      background: var(--accent);
      color: var(--accent-text);
      font: inherit;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.15s, opacity 0.2s;
    }
    .btn-add:hover { transform: translateY(-1px); }
    .btn-add:disabled { opacity: 0.5; cursor: default; transform: none; }

    /* ===== Daftar tugas ===== */
    .section-label { font-size: 13px; color: var(--muted); margin: 0 4px 12px; }
    #task-list { list-style: none; display: grid; gap: 12px; }

    .task {
      display: flex;
      gap: 14px;
      align-items: flex-start;
      padding: 18px;
      animation: muncul 0.3s ease;
    }
    @keyframes muncul { from { opacity: 0; transform: translateY(6px); } }

    /* Lingkaran inisial nama PIC */
    .avatar {
      width: 38px; height: 38px; border-radius: 50%;
      display: grid; place-items: center;
      background: rgba(232, 184, 109, 0.15);
      color: var(--accent);
      font-weight: 600;
      flex-shrink: 0;
    }
    .task-body { flex: 1; min-width: 0; }
    .task-title { font-size: 16px; font-weight: 600; word-wrap: break-word; }
    .task-meta { font-size: 13px; color: var(--muted); margin-top: 3px; }
    .task-note {
      font-size: 14px; margin-top: 8px; color: #cfcdc6;
      white-space: pre-wrap; word-wrap: break-word;
    }

    .btn-done {
      padding: 8px 16px;
      border-radius: 999px;
      border: 1px solid var(--glass-border);
      background: transparent;
      color: var(--text);
      font: inherit;
      font-size: 13px;
      cursor: pointer;
      flex-shrink: 0;
      transition: border-color 0.2s, color 0.2s;
    }
    .btn-done:hover { border-color: var(--danger); color: var(--danger); }
    .btn-done:disabled { opacity: 0.5; cursor: default; }

    .empty { text-align: center; color: var(--muted); padding: 34px 18px; font-size: 14px; }

    /* Tampilan HP: kolom form jadi satu */
    @media (max-width: 560px) {
      .row { grid-template-columns: 1fr; }
      .task { flex-wrap: wrap; }
      .btn-done { margin-left: 52px; }
    }

    /* Hormati pengaturan "kurangi animasi" di laptop/HP pengguna */
    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- Dynamic Island: isinya diubah lewat JavaScript -->
    <div class="island-wrap">
      <div class="island" id="island" role="status" aria-live="polite">
        <span class="dot"></span>
        <span id="island-text">Memuat...</span>
      </div>
    </div>

    <h1>Team Task &amp; Note List  </h1>

    <!-- Form tambah tugas (POST /api/tasks) -->
    <form id="task-form" class="glass" autocomplete="off">
      <div class="row">
        <div>
          <label for="title">Tugas</label>
          <input id="title" name="title" placeholder="Contoh: Rekam video demo" required>
        </div>
        <div>
          <label for="assignee">PIC</label>
          <input id="assignee" name="assignee" placeholder="Contoh: Hanif" required>
        </div>
      </div>
      <div>
        <label for="note">Catatan (opsional)</label>
        <textarea id="note" name="note" placeholder="Detail atau tenggat waktu"></textarea>
      </div>
      <button type="submit" class="btn-add" id="btn-add">Tambah tugas</button>
    </form>

    <!-- Daftar tugas (GET /api/tasks) -->
    <p class="section-label">Daftar tugas</p>
    <ul id="task-list"></ul>

  </div>

  <script>
    // Semua request lewat /api/ -> Nginx meneruskannya ke service "backend" (DNS Docker)
    const API = '/api/tasks';

    // Ambil elemen-elemen yang akan diubah
    const form = document.getElementById('task-form');
    const list = document.getElementById('task-list');
    const btnAdd = document.getElementById('btn-add');
    const island = document.getElementById('island');
    const islandText = document.getElementById('island-text');
    // Input form diambil lewat id (form.title tidak bisa dipakai, karena "title" bentrok dengan atribut bawaan form)
    const inputTitle = document.getElementById('title');
    const inputAssignee = document.getElementById('assignee');
    const inputNote = document.getElementById('note');

    let jumlahTugas = 0;   // dipakai untuk teks default di Dynamic Island
    let islandTimer = null;

    // ===== Dynamic Island =====
    // Teks default: jumlah tugas
    function islandDefault() {
      island.classList.remove('expand', 'error', 'success');
      islandText.textContent = jumlahTugas === 0 ? 'Belum ada tugas' : `${jumlahTugas} tugas aktif`;
    }

    // Tampilkan notifikasi sebentar (pil melebar), lalu kembali ke default
    function showIsland(pesan, tipe = 'success') {
      clearTimeout(islandTimer);
      island.classList.remove('error', 'success');
      island.classList.add('expand', tipe);
      islandText.textContent = pesan;
      islandTimer = setTimeout(islandDefault, 2200);
    }

    // Ubah "2026-11-10 18:18:21" jadi "10 Nov 2026, 18:18"
    function formatWaktu(teks) {
      try {
        const [tanggal, jam] = teks.split(' ');
        const [th, bl, hr] = tanggal.split('-');
        const bulan = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
        return `${Number(hr)} ${bulan[Number(bl) - 1]} ${th}, ${jam.slice(0, 5)}`;
      } catch {
        return teks || '';
      }
    }

    // ===== Tampilkan daftar tugas ke layar =====
    // Pakai createElement + textContent (bukan innerHTML) supaya input user aman dari script jahat
    function render(tasks) {
      list.innerHTML = '';
      jumlahTugas = tasks.length;

      if (tasks.length === 0) {
        const kosong = document.createElement('li');
        kosong.className = 'empty glass';
        kosong.textContent = 'Belum ada tugas. Tambahkan lewat form di atas.';
        list.appendChild(kosong);
        return;
      }

      tasks.forEach((task, index) => {
        const li = document.createElement('li');
        li.className = 'task glass';

        // Lingkaran inisial PIC
        const avatar = document.createElement('div');
        avatar.className = 'avatar';
        avatar.textContent = (task.assignee || '?').trim().charAt(0).toUpperCase();

        // Isi tugas: judul, PIC + waktu, catatan
        const body = document.createElement('div');
        body.className = 'task-body';

        const judul = document.createElement('div');
        judul.className = 'task-title';
        judul.textContent = task.title;

        const meta = document.createElement('div');
        meta.className = 'task-meta';
        meta.textContent = `${task.assignee} · ${formatWaktu(task.created_at)}`;

        body.append(judul, meta);

        if (task.note) {
          const note = document.createElement('div');
          note.className = 'task-note';
          note.textContent = task.note;
          body.appendChild(note);
        }

        // Tombol Selesai -> DELETE /api/tasks?index=X
        const btn = document.createElement('button');
        btn.className = 'btn-done';
        btn.textContent = 'Selesai';
        btn.addEventListener('click', () => deleteTask(index, btn));

        li.append(avatar, body, btn);
        list.appendChild(li);
      });
    }

    // ===== GET: ambil semua tugas dari backend =====
    async function loadTasks() {
      try {
        const res = await fetch(API);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const tasks = await res.json();
        render(tasks);
        // Jangan timpa notifikasi yang sedang tampil
        if (!island.classList.contains('expand')) islandDefault();
      } catch (err) {
        console.warn('Gagal memuat tugas:', err);
        showIsland('Backend tidak bisa dihubungi', 'error');
      }
    }

    // ===== POST: tambah tugas baru =====
    form.addEventListener('submit', async (e) => {
      e.preventDefault(); // jangan reload halaman

      const data = {
        title: inputTitle.value.trim(),
        assignee: inputAssignee.value.trim(),
        note: inputNote.value.trim(),
      };

      // Validasi sederhana di sisi browser (backend tetap cek & balas 400 kalau salah)
      if (!data.title || !data.assignee) {
        showIsland('Tugas dan PIC wajib diisi', 'error');
        return;
      }

      btnAdd.disabled = true; // cegah klik dobel
      try {
        const res = await fetch(API, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data),
        });
        const hasil = await res.json();
        if (!res.ok) {
          showIsland(hasil.error || 'Gagal menambah tugas', 'error');
          return;
        }
        form.reset();
        inputTitle.focus();
        showIsland('Tugas ditambahkan');
        await loadTasks(); // langsung update daftar tanpa refresh
      } catch (err) {
        console.warn('Gagal menambah tugas:', err);
        showIsland('Backend tidak bisa dihubungi', 'error');
      } finally {
        btnAdd.disabled = false;
      }
    });

    // ===== DELETE: hapus / selesaikan tugas =====
    async function deleteTask(index, btn) {
      btn.disabled = true;
      try {
        const res = await fetch(`${API}?index=${index}`, { method: 'DELETE' });
        const hasil = await res.json();
        if (!res.ok) {
          showIsland(hasil.error || 'Gagal menghapus tugas', 'error');
          btn.disabled = false;
          return;
        }
        showIsland('Tugas selesai');
        await loadTasks(); // langsung update daftar tanpa refresh
      } catch (err) {
        console.warn('Gagal menghapus tugas:', err);
        showIsland('Backend tidak bisa dihubungi', 'error');
        btn.disabled = false;
      }
    }

    // Muat daftar tugas saat halaman pertama kali dibuka
    loadTasks();
  </script>
</body>
</html>
